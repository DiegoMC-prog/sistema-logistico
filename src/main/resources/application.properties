spring.application.name=backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tienda_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

# Remitente de los correos del sistema (contrasenas temporales de usuarios, etc.)
app.mail.from=${MAIL_FROM:no-reply@tienda.local}
# Aspecto de los correos HTML (plantillas en src/main/resources/templates/correo)
app.mail.tienda-nombre=${MAIL_TIENDA_NOMBRE:Tienda}
app.mail.color-principal=${MAIL_COLOR_PRINCIPAL:#1d4ed8}