spring.application.name=backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tienda_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

# Seguridad: JWT (access token corto + refresh token en BD). JWT_SECRET es obligatorio (minimo 32 bytes).
app.seguridad.jwt.secret=${JWT_SECRET:}
app.seguridad.jwt.access-minutos=${JWT_ACCESS_MINUTOS:15}
app.seguridad.jwt.refresh-dias=${JWT_REFRESH_DIAS:7}
# Lista de tokens revocados: memoria (una sola instancia) o redis (varias instancias / sobrevive reinicios)
app.seguridad.revocacion=${APP_REVOCACION:memoria}

# CORS: origenes del frontend permitidos, separados por coma (por defecto los puertos tipicos de React/Vite/Angular)
app.cors.origenes=${CORS_ORIGENES:http://localhost:3000,http://localhost:5173,http://localhost:4200}

# Redis (solo se usa con APP_REVOCACION=redis); timeouts bajos para que una caida no cuelgue las peticiones
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms

# Remitente de los correos del sistema (contrasenas temporales de usuarios, etc.)
# Pantalla del frontend donde se elige la contrasena nueva; el correo de "olvide mi contrasena" enlaza a ella (?token=...)
app.frontend.url-restablecer=${FRONTEND_URL_RESTABLECER:http://localhost:4200/restablecer}
app.mail.from=${MAIL_FROM:no-reply@tienda.local}
# Aspecto de los correos HTML (plantillas en src/main/resources/templates/correo)
app.mail.tienda-nombre=${MAIL_TIENDA_NOMBRE:Tienda}
app.mail.color-principal=${MAIL_COLOR_PRINCIPAL:#1d4ed8}
# Plazo maximo para devolver una venta, en dias desde la fecha de la venta (0 = sin limite)
app.devoluciones.dias-maximos=${DEVOLUCIONES_DIAS_MAXIMOS:30}
