# Detras de un tunel (Cloudflare) la IP real y el protocolo llegan en cabeceras; en acceso local no existen
map $http_cf_connecting_ip $ip_cliente {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}
map $http_x_forwarded_proto $protocolo {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API: mismo origen que la aplicacion, el frontend llama a /api/v1
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $http_host;
        # Se sobrescribe (no se concatena) para que el cliente no pueda falsificar su IP
        proxy_set_header X-Forwarded-For   $ip_cliente;
        proxy_set_header X-Forwarded-Proto $protocolo;
        proxy_read_timeout 120s;
    }

    # Archivos con hash en el nombre: se pueden guardar en cache sin riesgo
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Rutas de Angular (/pos, /restablecer...): siempre se entrega index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
