spring.application.name=backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tienda_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

# Seguridad: JWT (access token corto + refresh token en BD). JWT_SECRET es obligatorio (minimo 32 bytes).
app.seguridad.jwt.secret=${JWT_SECRET:}
app.seguridad.jwt.access-minutos=${JWT_ACCESS_MINUTOS:15}
app.seguridad.jwt.refresh-dias=${JWT_REFRESH_DIAS:7}
# Lista de tokens revocados: memoria (una sola instancia) o redis (varias instancias / sobrevive reinicios)
app.seguridad.revocacion=${APP_REVOCACION:memoria}

# CORS: origenes del frontend permitidos, separados por coma (por defecto los puertos tipicos de React/Vite/Angular)
app.cors.origenes=${CORS_ORIGENES:http://localhost:3000,http://localhost:5173,http://localhost:4200}

# Redis (solo se usa con APP_REVOCACION=redis); timeouts bajos para que una caida no cuelgue las peticiones
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms

# Remitente de los correos del sistema (contrasenas temporales de usuarios, etc.)
# Pantalla del frontend donde se elige la contrasena nueva; el correo de "olvide mi contrasena" enlaza a ella (?token=...)
app.frontend.url-restablecer=${FRONTEND_URL_RESTABLECER:http://localhost:4200/restablecer}
app.mail.from=${MAIL_FROM:no-reply@tienda.local}
# Aspecto de los correos HTML (plantillas en src/main/resources/templates/correo)
app.mail.tienda-nombre=${MAIL_TIENDA_NOMBRE:Tienda}
app.mail.color-principal=${MAIL_COLOR_PRINCIPAL:#1d4ed8}
# Plazo maximo para devolver una venta, en dias desde la fecha de la venta (0 = sin limite)
app.devoluciones.dias-maximos=${DEVOLUCIONES_DIAS_MAXIMOS:30}

# Alertas (RF-13, RF-16): dias de anticipacion para avisar vencimientos, hora de la revision diaria
# (cron de Spring: seg min hora dia mes dia-semana) y si tambien se revisa al arrancar la aplicacion
app.alertas.vencimiento.dias=${ALERTAS_VENCIMIENTO_DIAS:30}
app.alertas.cron=${ALERTAS_CRON:0 0 6 * * *}
app.alertas.al-iniciar=${ALERTAS_AL_INICIAR:true}

# Reorden (RF-34). Valores globales; costo de pedido, almacenamiento, nivel de servicio y proveedor se pueden
# sobrescribir por producto desde la pantalla de abastecimiento.
# costo-pedido: S, costo de emitir un pedido. costo-almacen-pct: costo anual de mantener una unidad como fraccion de
# su costo (0.25 = 25 %). nivel-servicio: probabilidad de no quedarse sin stock durante el lead time.
app.reorden.costo-pedido=${REORDEN_COSTO_PEDIDO:50}
app.reorden.costo-almacen-pct=${REORDEN_COSTO_ALMACEN_PCT:0.25}
app.reorden.nivel-servicio=${REORDEN_NIVEL_SERVICIO:0.95}
# Dias de ventas que se analizan y minimo de historial antes de sugerir (el documento recomienda 3 meses)
app.reorden.dias-ventana=${REORDEN_DIAS_VENTANA:90}
app.reorden.historial-minimo-dias=${REORDEN_HISTORIAL_MINIMO_DIAS:90}
# Lead time asumido para un proveedor sin recepciones registradas
app.reorden.lead-time-defecto-dias=${REORDEN_LEAD_TIME_DEFECTO_DIAS:7}
app.reorden.cron=${REORDEN_CRON:0 30 2 * * *}
# RF-35: si el costo del proveedor subio al menos alza-umbral (0.05 = 5 %) en los ultimos alza-ventana-dias,
# el punto de reorden suma alza-anticipo-dias de demanda: se compra antes, al costo actual (0 dias = desactivado)
app.reorden.alza-ventana-dias=${REORDEN_ALZA_VENTANA_DIAS:90}
app.reorden.alza-umbral=${REORDEN_ALZA_UMBRAL:0.05}
app.reorden.alza-anticipo-dias=${REORDEN_ALZA_ANTICIPO_DIAS:7}
