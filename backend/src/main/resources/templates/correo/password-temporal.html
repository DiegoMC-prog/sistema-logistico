<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${asunto}">Acceso al sistema</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background-color:#f3f4f6;padding:24px 12px;">
    <tr>
        <td align="center">

            <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
                   style="width:100%;max-width:600px;background-color:#ffffff;border-radius:8px;overflow:hidden;">

                <tr th:replace="~{correo/fragmentos :: cabecera}"></tr>

                <tr>
                    <td style="padding:32px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#1f2937;">

                        <p style="margin:0 0 16px 0;">
                            Hola <strong th:text="${nombre}">Nombre</strong>,
                        </p>

                        <p style="margin:0 0 24px 0;">
                            Se creó o restableció su acceso al sistema. Use estos datos para ingresar:
                        </p>

                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                               style="background-color:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;">
                            <tr>
                                <td style="padding:16px 20px;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#374151;">
                                    <div style="margin-bottom:12px;">
                                        <span style="display:block;font-size:12px;color:#6b7280;">Usuario</span>
                                        <strong style="font-size:16px;" th:text="${username}">usuario</strong>
                                    </div>
                                    <div>
                                        <span style="display:block;font-size:12px;color:#6b7280;">Contraseña temporal</span>
                                        <strong style="font-family:'Courier New',Courier,monospace;font-size:18px;letter-spacing:1px;"
                                                th:text="${passwordTemporal}">contraseña</strong>
                                    </div>
                                </td>
                            </tr>
                        </table>

                        <p style="margin:24px 0 0 0;">
                            Por seguridad, deberá <strong>cambiar esta contraseña</strong> la primera vez que ingrese.
                        </p>

                    </td>
                </tr>

                <tr th:replace="~{correo/fragmentos :: pie}"></tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
