# Perfil "seed": ademas de las migraciones, Flyway aplica los datos de desarrollo de db/seed (R__*.sql).
# Uso:  SPRING_PROFILES_ACTIVE=seed ./gradlew bootRun     (o  ./gradlew bootRun --args='--spring.profiles.active=seed')
# Las migraciones repetibles se omiten solas si la base ya tiene datos; para volver a sembrar, recree la base.
spring.flyway.locations=classpath:db/migration,classpath:db/seed
